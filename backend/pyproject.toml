[project]
name = "rishta-tracker-backend"
version = "0.1.0"
description = "Mac-hosted multimodal AI backend for Rishta Tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.1",
    "openai>=1.55.0",
    "httpx>=0.28.0",
    "pymupdf>=1.25.0",
    "pillow>=11.0.0",
    "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

