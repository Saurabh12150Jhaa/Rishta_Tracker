services:
  - type: web
    name: sister-rishta-dossier
    runtime: docker
    plan: free
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: WORKER_SHARED_SECRET
        sync: false
      - key: OWNER_DEFAULT_PIN
        value: "1234"
      - key: FAMILY_DEFAULT_PIN
        value: "0000"
